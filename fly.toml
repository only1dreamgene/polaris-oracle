# Fly.io app config for polaris-oracle.
#
# Three gotchas this config exists to avoid (see README for the full story):
# 1. Fly's proxy reaches machines over private IPv6 — main.ts already binds
#    '::' rather than '0.0.0.0', but the app is still unreachable if
#    `internal_port` here doesn't match the PORT the process actually
#    listens on.
# 2. `auto_stop_machines` MUST stay 'off' — idle-suspend would kill the live
#    Pyth Lazer WebSocket and the in-process settlement timers, silently
#    turning off automation until the next request happens to wake it.
# 3. `min_machines_running = 1` for the same reason: this process needs to
#    keep running even with zero HTTP traffic.

app = "polaris-oracle"
primary_region = "iad"

[build]

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[mounts]]
  source = "polaris_oracle_data"
  destination = "/app/data"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
